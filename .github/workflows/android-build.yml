
name: KaskaNet Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle wrapper gradlew was not found"
            echo "Check that the Android project files were uploaded."
            exit 1
          fi

          DIR=$(dirname "$WRAPPER")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaskaNet-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
